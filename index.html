<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Loading…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #flash {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    cursor: pointer;
  }

  #flash.hidden { display: none; }

  #video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s linear;
  }

  #video.active {
    opacity: 1;
    pointer-events: auto;
  }
</style>
</head>
<body>

<div id="flash" aria-hidden="true"></div>

<video id="video"
       src="video.mp4"
       playsinline
       preload="auto"></video>

<script>
(function () {
  "use strict";

  const flash = document.getElementById("flash");
  const video = document.getElementById("video");

  video.addEventListener("error", function () {
    console.error("Ошибка видео:", video.error);
  });
  video.addEventListener("loadedmetadata", function () {
    console.log("Видео загружено:", video.videoWidth + "x" + video.videoHeight, video.duration + "s");
  });

  /* ---------- Мигание чёрный ↔ белый ---------- */

  var flashing = true;

  function scheduleFlash() {
    if (!flashing) return;
    var isWhite = flash.dataset.state !== "white";
    flash.style.backgroundColor = isWhite ? "#ffffff" : "#000000";
    flash.dataset.state = isWhite ? "white" : "black";
    var base = 180;
    var jitter = Math.random() * 90;
    var occasionalPause = Math.random() < 0.04 ? 400 : 0;
    setTimeout(scheduleFlash, base + jitter + occasionalPause);
  }
  scheduleFlash();

  /* ---------- Аудио через Web Audio ---------- */

  var audioCtx = null;

  function setupAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      var sourceNode = audioCtx.createMediaElementSource(video);
      var gainNode = audioCtx.createGain();
      gainNode.gain.value = 1.0;
      sourceNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      if (audioCtx.state === "suspended") audioCtx.resume().catch(function () {});
    } catch (e) {
      console.warn("WebAudio недоступен:", e);
      audioCtx = null;
    }
  }

  /* ---------- Fullscreen + ориентация ---------- */

  function requestFullscreen() {
    var el = document.documentElement;
    try {
      if (el.requestFullscreen)            el.requestFullscreen().catch(function () {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch (e) {}
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(function () {});
      }
    } catch (e) {}
  }

  /* ---------- Активация по первому действию ---------- */

  var activated = false;

  function activate() {
    if (activated) return;
    activated = true;

    ACTION_EVENTS.forEach(function (name) {
      document.removeEventListener(name, activate, true);
    });

    requestFullscreen();

    flashing = false;
    flash.classList.add("hidden");

    video.classList.add("active");
    setupAudio();

    video.muted = false;
    video.volume = 1.0;

    var playPromise = video.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(function (err) {
        console.warn("play() заблокирован:", err);
        video.muted = true;
        video.play().then(function () {
          setTimeout(function () {
            video.muted = false;
            if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(function () {});
          }, 50);
        }).catch(function (e) {
          console.error("Повторный play() не удался:", e);
        });
      });
    }

    // video.loop = true;
  }

  var ACTION_EVENTS = [
    "touchstart", "touchend",
    "pointerdown", "pointerup",
    "mousedown", "click",
    "keydown"
  ];
  ACTION_EVENTS.forEach(function (name) {
    document.addEventListener(name, activate, { capture: true, passive: true });
  });

  try { video.load(); } catch (e) {}

})();
</script>
</body>
</html>
