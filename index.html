<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Loading…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #flash {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    cursor: pointer;
  }

  #flash.hidden { display: none; }

  #video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s linear;
  }

  #video.active {
    opacity: 1;
    pointer-events: auto;
  }

  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-family: ui-monospace, "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 2px;
    z-index: 15;
    pointer-events: none;
    text-align: center;
    mix-blend-mode: difference;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.15; }
    50%      { opacity: 0.6; }
  }
</style>
</head>
<body>

<div id="flash" aria-hidden="true"></div>
<video id="video"
       src="video.mp4"
       playsinline
       preload="auto"></video>
<div id="hint">[ нажмите в любом месте ]</div>

<script>
(function () {
  "use strict";

  const flash = document.getElementById("flash");
  const video = document.getElementById("video");
  const hint  = document.getElementById("hint");

  // Диагностика: увидим в консоли, что видео вообще загружается
  video.addEventListener("error", () => {
    console.error("Ошибка видео:", video.error);
  });
  video.addEventListener("loadedmetadata", () => {
    console.log("Видео загружено:", video.videoWidth + "x" + video.videoHeight, video.duration + "s");
  });

  /* ---------- 1. Мигание ---------- */

  let flashing = true;

  function scheduleFlash() {
    if (!flashing) return;
    const isWhite = flash.dataset.state !== "white";
    flash.style.backgroundColor = isWhite ? "#ffffff" : "#000000";
    flash.dataset.state = isWhite ? "white" : "black";
    const base = 180;
    const jitter = Math.random() * 90;
    const occasionalPause = Math.random() < 0.04 ? 400 : 0;
    setTimeout(scheduleFlash, base + jitter + occasionalPause);
  }
  scheduleFlash();

  /* ---------- 2. Аудио ---------- */

  let audioCtx = null;

  function setupAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      const sourceNode = audioCtx.createMediaElementSource(video);
      const gainNode   = audioCtx.createGain();
      gainNode.gain.value = 1.0;
      sourceNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    } catch (e) {
      console.warn("WebAudio недоступен:", e);
      audioCtx = null;
    }
  }

  /* ---------- 3. Fullscreen ---------- */

  function requestFullscreen() {
    const el = document.documentElement;
    try {
      if (el.requestFullscreen)            el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch (e) {}
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(() => {});
      }
    } catch (e) {}
  }

  /* ---------- 4. Активация ---------- */

  let activated = false;

  function activate() {
    if (activated) return;
    activated = true;

    ACTION_EVENTS.forEach(name => {
      document.removeEventListener(name, activate, true);
    });

    requestFullscreen();

    flashing = false;
    flash.classList.add("hidden");
    if (hint) hint.style.display = "none";   // ← null-safe

    video.classList.add("active");
    setupAudio();

    video.muted  = false;
    video.volume = 1.0;

    const playPromise = video.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(err => {
        console.warn("play() заблокирован:", err);
        video.muted = true;
        video.play().then(() => {
          setTimeout(() => {
            video.muted = false;
            if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
          }, 50);
        }).catch(e => console.error("Повторный play() не удался:", e));
      });
    }

    // video.loop = true;
  }

  const ACTION_EVENTS = [
    "touchstart", "touchend",
    "pointerdown", "pointerup",
    "mousedown", "click",
    "keydown"
  ];
  ACTION_EVENTS.forEach(name => {
    document.addEventListener(name, activate, { capture: true, passive: true });
  });

  try { video.load(); } catch (e) {}

})();
</script>
</body>
</html>
