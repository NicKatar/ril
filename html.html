<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Loading…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #flash {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    cursor: pointer;
    transition: background-color 0ms;
  }

  #flash.hidden { display: none; }

  #video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s linear;
  }

  #video.active {
    opacity: 1;
    pointer-events: auto;
  }

  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-family: ui-monospace, "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 2px;
    z-index: 15;
    pointer-events: none;
    text-align: center;
    mix-blend-mode: difference;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.15; }
    50%      { opacity: 0.6; }
  }
</style>
</head>
<body>

<div id="flash" aria-hidden="true"></div>
<video id="video"
       src="video.mp4"
       playsinline
       preload="auto"
       crossorigin="anonymous"></video>

<script>
(function () {
  "use strict";

  const flash = document.getElementById("flash");
  const video = document.getElementById("video");
  const hint  = document.getElementById("hint");

  /* ---------- 1. Мигание чёрный ↔ белый ---------- */

  let flashing = true;

  // Базовый период ~200мс => ~2.5 полных цикла в секунду (безопаснее порога).
  // Плюс небольшая случайная добавка, чтобы ощущалось "сломанным", а не как строб.
  function scheduleFlash() {
    if (!flashing) return;

    const isWhite = flash.dataset.state !== "white";
    flash.style.backgroundColor = isWhite ? "#ffffff" : "#000000";
    flash.dataset.state = isWhite ? "white" : "black";

    const base = 180;
    const jitter = Math.random() * 90;      // 0–90 мс
    const occasionalPause = Math.random() < 0.04 ? 400 : 0; // редкий "сбой"
    setTimeout(scheduleFlash, base + jitter + occasionalPause);
  }
  scheduleFlash();

  /* ---------- 2. Аудио через Web Audio (важно для iOS) ---------- */

  let audioCtx = null;
  let gainNode = null;
  let sourceNode = null;

  function setupAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      sourceNode = audioCtx.createMediaElementSource(video);
      gainNode = audioCtx.createGain();
      gainNode.gain.value = 1.0;
      sourceNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
    } catch (e) {
      console.warn("WebAudio недоступен:", e);
      audioCtx = null;
    }
  }

  /* ---------- 3. Fullscreen + ориентация ---------- */

  function requestFullscreen() {
    const el = document.documentElement;
    try {
      if (el.requestFullscreen)            el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
      else if (el.msRequestFullscreen)     el.msRequestFullscreen();
    } catch (e) { /* ignore */ }

    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(() => {});
      } else if (screen.lockOrientation) {
        screen.lockOrientation("landscape");
      }
    } catch (e) { /* ignore */ }
  }

  /* ---------- 4. Активация по первому действию ---------- */

  let activated = false;

  function activate() {
    if (activated) return;
    activated = true;

    ACTION_EVENTS.forEach(name => {
      document.removeEventListener(name, activate, true);
    });

    // 1) Fullscreen — синхронно внутри жеста
    requestFullscreen();

    // 2) Останавливаем мигание
    flashing = false;
    flash.classList.add("hidden");
    hint.style.display = "none";

    // 3) Показываем видео
    video.classList.add("active");

    // 4) Настраиваем аудио ДО play()
    setupAudio();

    // 5) Полная громкость и запуск
    video.muted  = false;
    video.volume = 1.0;

    const playPromise = video.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(err => {
        console.warn("play() заблокирован:", err);
        video.muted = true;
        video.play().then(() => {
          setTimeout(() => {
            video.muted = false;
            if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
          }, 50);
        }).catch(() => {});
      });
    }

    // video.loop = true; // раскомментируйте, если нужно зацикливание
  }

  const ACTION_EVENTS = [
    "touchstart", "touchend",
    "pointerdown", "pointerup",
    "mousedown", "click",
    "keydown"
  ];
  ACTION_EVENTS.forEach(name => {
    document.addEventListener(name, activate, { capture: true, passive: true });
  });

  /* ---------- 5. Предзагрузка видео ---------- */
  try { video.load(); } catch (e) { /* ignore */ }

})();
</script>
</body>
</html>
